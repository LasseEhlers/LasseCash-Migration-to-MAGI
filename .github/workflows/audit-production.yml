# Asks the LIVE chain the invariants that only ever ran against a simulation.
# Read-only: public GraphQL queries and simulations. No secrets, no key, no RC,
# no HBD, nothing is broadcast. See tools/audit-production.py for the why.
#
# Hourly since 2026-10-04: update #4 activated, reconcile_float minted the
# missing backing (tx abcab9d8cca9bd68cf42825a1bb5edf00edcb35c) and the first
# run afterwards read ALL CHECKS PASS. A red run now is a real alarm.
name: audit-production

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exit status is non-zero on any failed check, which is what makes
      # GitHub email the owner; it stays silent while everything passes.
      - run: python3 tools/audit-production.py
