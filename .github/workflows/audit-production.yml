# Asks the LIVE chain the invariants that only ever ran against a simulation.
# Read-only: public GraphQL queries and simulations. No secrets, no key, no RC,
# no HBD, nothing is broadcast. See tools/audit-production.py for the why.
#
# ⚠️ THE HOURLY SCHEDULE IS DELIBERATELY OFF until update #4 activates (Sunday
# 4 October, after 04:36 CPH) and the audit reads green. The `backing` check is
# RED today, correctly, and a scheduled run would email a failure every hour
# for two days about a fault we already know. Switch it on by uncommenting the
# two `schedule` lines AFTER the first green manual run.
name: audit-production

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "17 * * * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exit status is non-zero on any failed check, which is what makes
      # GitHub email the owner; it stays silent while everything passes.
      - run: python3 tools/audit-production.py
